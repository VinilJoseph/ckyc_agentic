<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CKYC Marketplace & Reviewer Workspace</title>

  <!-- Pre-hydration Theme Script (Zero-Flash) -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('ckyc_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: {
              light: '#F8FAFC',
              dark: '#0D0D10',
            },
            surface: {
              light: '#FFFFFF',
              dark: '#16161A',
              subtleDark: '#202026',
            },
            brand: {
              cyan: '#00C2CB',
              mint: '#10B981',
              slate: '#0F172A',
            },
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Custom CSS for Design System -->
  <style>
    :root {
      --canvas-bg: #F8FAFC;
      --text-color: #0F172A;
      --holo-gradient: linear-gradient(135deg, rgba(0, 194, 203, 0.15) 0%, rgba(99, 102, 241, 0.15) 50%, rgba(236, 72, 153, 0.15) 100%);
    }
    .dark {
      --canvas-bg: #0D0D10;
      --text-color: #F4F4F6;
    }
    body {
      background-color: var(--canvas-bg);
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      min-height: 100vh;
    }
    .dark-grid-bg {
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .holo-border {
      border: 1px solid transparent;
      background-image: linear-gradient(var(--surface-card, #16161A), var(--surface-card, #16161A)), var(--holo-gradient);
      background-origin: border-box;
      background-clip: padding-box, border-box;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>

  <!-- React 18 & ReactDOM via CDN for Zero-Build Immediate Execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for In-Browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="dark-grid-bg">
  <div id="root"></div>

  <!-- Standalone React Showcase App (Features: ReviewerWorkspace, DecisionBar, BiometricCard, EmailSimulatorModal, CredentialShowcase) -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Initial Dataset & Offline Fallback ---
    const INITIAL_CASES = [
      {
        id: 'case-001',
        case_number: 'CASE-1042',
        purpose: 'Merchant Seller Onboarding Verification',
        case_type: 'individual',
        status: 'in_review',
        applicant_name: 'Aarav Sharma',
        created_at: new Date(Date.now() - 3600000 * 4).toISOString(),
        document_count: 2,
        documents: [
          {
            id: 'doc-1',
            original_filename: 'aadhaar_card_front.pdf',
            document_type: 'identity_card',
            mime_type: 'application/pdf',
            file_size: 1420580,
            file_hash: '3f7a8109d93e1a0b3f88bc92d19e09d1c1a2f3a47981bce29d84e9c71a3980',
          },
          {
            id: 'doc-2',
            original_filename: 'pan_card_specimen.jpg',
            document_type: 'tax_card',
            mime_type: 'image/jpeg',
            file_size: 890450,
            file_hash: 'a9b8c7d6e5f432109876543210abcdef0123456789abcdef0123456789abcdef',
          },
        ],
        extracted_fields: [
          { id: 'f1', field_name: 'full_name', draft_value: 'Aarav Sharma', confirmed_value: null, confidence: 0.98, source_page: 1, reviewer_decision: 'confirmed', correction_history: [] },
          { id: 'f2', field_name: 'date_of_birth', draft_value: '1990-05-15', confirmed_value: null, confidence: 0.96, source_page: 1, reviewer_decision: 'confirmed', correction_history: [] },
          { id: 'f3', field_name: 'document_number', draft_value: '2948 2847 2841', confirmed_value: null, confidence: 0.99, source_page: 1, reviewer_decision: 'confirmed', correction_history: [] },
          { id: 'f4', field_name: 'gender', draft_value: 'Male', confirmed_value: null, confidence: 0.95, source_page: 1, reviewer_decision: 'confirmed', correction_history: [] },
          { id: 'f5', field_name: 'address', draft_value: '42 Lotus Boulevard, Indiranagar, Bengaluru 560038', confirmed_value: null, confidence: 0.91, source_page: 1, reviewer_decision: 'confirmed', correction_history: [] },
        ],
        validation_issues: [
          { code: 'VERHOEFF_CHECKSUM_VALID', field_name: 'aadhaar_number', severity: 'PASS', message: '✓ Verhoeff D5 dihedral checksum verified valid' },
          { code: 'PAN_STRUCTURE_VALID', field_name: 'pan_number', severity: 'PASS', message: '✓ PAN entity character matches Individual (P) and surname initial (S)' },
          { code: 'AGE_REQUIREMENT_VERIFIED', field_name: 'date_of_birth', severity: 'PASS', message: '✓ Statutory age gate passed: Applicant is 34 (>= 18 years)' },
          { code: 'NAME_SIMILARITY_MATCH', field_name: 'full_name', severity: 'PASS', message: '✓ Token Sort fuzzy name match: 94% similarity score' },
        ],
        selfie_match: {
          is_match: true,
          confidence: 0.924,
          threshold: 0.75,
          method: 'opencv_sface',
          details: 'Biometric facial comparison completed with high fidelity',
        },
      },
      {
        id: 'case-002',
        case_number: 'CASE-1043',
        purpose: 'High-Volume Enterprise Account Opening',
        case_type: 'business',
        status: 'documents_received',
        applicant_name: 'Apex Horizon Tech Pvt Ltd',
        created_at: new Date(Date.now() - 3600000 * 12).toISOString(),
        document_count: 3,
        documents: [
          {
            id: 'doc-3',
            original_filename: 'certificate_of_incorporation.pdf',
            document_type: 'certificate',
            mime_type: 'application/pdf',
            file_size: 2100000,
            file_hash: '9f8e7d6c5b4a3210fedcba9876543210123456789abcdef0123456789abcdef',
          },
        ],
        extracted_fields: [
          { id: 'f201', field_name: 'business_name', draft_value: 'Apex Horizon Tech Pvt Ltd', confirmed_value: null, confidence: 0.97, source_page: 1, reviewer_decision: 'pending', correction_history: [] },
          { id: 'f202', field_name: 'cin_number', draft_value: 'U72200KA2021PTC148920', confirmed_value: null, confidence: 0.95, source_page: 1, reviewer_decision: 'pending', correction_history: [] },
        ],
        validation_issues: [
          { code: 'CIN_FORMAT_VALID', field_name: 'cin_number', severity: 'PASS', message: '✓ Valid MCA CIN format structure' },
        ],
        selfie_match: { is_match: true, confidence: 0.86, threshold: 0.75, method: 'opencv_sface' },
      },
      {
        id: 'case-003',
        case_number: 'CASE-1044',
        purpose: 'Cross-Border Contractor Verification',
        case_type: 'individual',
        status: 'approved',
        applicant_name: 'Priya Sundaram',
        created_at: new Date(Date.now() - 86400000 * 2).toISOString(),
        document_count: 2,
        documents: [],
        extracted_fields: [],
        validation_issues: [],
        selfie_match: { is_match: true, confidence: 0.96 },
      },
    ];

    const INITIAL_EXCEPTIONS = [
      {
        id: 'exc-01',
        sender: 'contractor.support@gmail.com',
        subject: 'Additional ID Proofs for Review (No Case Reference)',
        attachments_count: 1,
        status: 'unmatched',
        timestamp: new Date().toISOString(),
      },
      {
        id: 'exc-02',
        sender: 'vendor_queries@cloudtech.in',
        subject: 'Urgent: Registration Documents attached',
        attachments_count: 2,
        status: 'unmatched',
        timestamp: new Date().toISOString(),
      },
    ];

    // --- App Component (Root Coordinator) ---
    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('ckyc_theme') || 'dark');
      const [activeView, setActiveView] = useState('dashboard');
      const [cases, setCases] = useState(INITIAL_CASES);
      const [currentCaseId, setCurrentCaseId] = useState(null);
      const [exceptions, setExceptions] = useState(INITIAL_EXCEPTIONS);

      // Modals
      const [isNewCaseModalOpen, setIsNewCaseModalOpen] = useState(false);
      const [isEmailModalOpen, setIsEmailModalOpen] = useState(false);
      const [isCredentialModalOpen, setIsCredentialModalOpen] = useState(false);
      const [isPortalModalOpen, setIsPortalModalOpen] = useState(false);

      // Form inputs
      const [newCaseName, setNewCaseName] = useState('');
      const [newCaseType, setNewCaseType] = useState('individual');
      const [newCasePurpose, setNewCasePurpose] = useState('');

      // Theme sync
      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('ckyc_theme', theme);
      }, [theme]);

      // Live Backend Data Fetching with Graceful Fallback
      useEffect(() => {
        let isMounted = true;
        async function loadBackendData() {
          try {
            const res = await fetch('/api/v1/cases');
            if (res.ok) {
              const data = await res.json();
              if (isMounted && data && Array.isArray(data.items) && data.items.length > 0) {
                setCases(data.items);
              }
            }
          } catch (e) {
            // Offline fallback: keep INITIAL_CASES
          }

          try {
            const excRes = await fetch('/api/v1/email/exceptions');
            if (excRes.ok) {
              const excData = await excRes.json();
              if (isMounted && excData && Array.isArray(excData.items)) {
                setExceptions(excData.items.length > 0 ? excData.items : INITIAL_EXCEPTIONS);
              }
            }
          } catch (e) {
            // Offline fallback: keep INITIAL_EXCEPTIONS
          }
        }
        loadBackendData();
        return () => { isMounted = false; };
      }, []);

      const toggleTheme = () => {
        setTheme((prev) => (prev === 'dark' ? 'light' : 'dark'));
      };

      const handleSelectCase = (c) => {
        setCurrentCaseId(c.id);
        setActiveView('workspace');
      };

      const currentCase = cases.find((c) => c.id === currentCaseId) || cases[0];

      // Update field decision
      const handleUpdateFieldDecision = async (fieldId, decision, correctedValue, notes) => {
        setCases((prev) =>
          prev.map((c) => {
            if (c.id !== currentCase.id) return c;
            const updatedFields = (c.extracted_fields || []).map((f) => {
              if (f.id !== fieldId) return f;
              const newHist = [...(f.correction_history || [])];
              if (decision === 'corrected' && correctedValue && correctedValue !== f.draft_value) {
                newHist.push({
                  from_value: f.confirmed_value || f.draft_value,
                  to_value: correctedValue,
                  timestamp: new Date().toISOString(),
                  reviewer_id: 'Reviewer-01',
                });
              }
              return {
                ...f,
                reviewer_decision: decision,
                confirmed_value: decision === 'corrected' ? correctedValue : decision === 'confirmed' ? (f.confirmed_value || f.draft_value) : null,
                reviewer_notes: notes || f.reviewer_notes,
                correction_history: newHist,
              };
            });
            return { ...c, extracted_fields: updatedFields };
          })
        );

        try {
          await fetch(`/api/v1/cases/${currentCase.id}/fields/${fieldId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reviewer_decision: decision, corrected_value: correctedValue, reviewer_notes: notes }),
          });
        } catch (e) {}
      };

      // Advance to In Review
      const handleAdvanceToReview = async () => {
        setCases((prev) =>
          prev.map((c) => (c.id === currentCase.id ? { ...c, status: 'in_review' } : c))
        );
        try {
          await fetch(`/api/v1/cases/${currentCase.id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'in_review' }),
          });
        } catch (e) {}
      };

      // Request corrections
      const handleRequestCorrection = (reason) => {
        setCases((prev) =>
          prev.map((c) => (c.id === currentCase.id ? { ...c, status: 'needs_applicant_correction', reason } : c))
        );
        alert(`Case transitioned to 'needs_applicant_correction'. Applicant notification dispatched.`);
      };

      // Final Approval Gate (Mandatory Written Justification)
      const handleApproveCase = async (justification) => {
        setCases((prev) =>
          prev.map((c) => (c.id === currentCase.id ? { ...c, status: 'approved', review_decision: 'approved', reason: justification } : c))
        );
        try {
          await fetch(`/api/v1/cases/${currentCase.id}/approve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: justification }),
          });
        } catch (e) {}
        alert(`Case ${currentCase.case_number} successfully APPROVED with justification:\n"${justification}"`);
      };

      // Final Rejection Gate (Mandatory Written Justification)
      const handleRejectCase = async (justification) => {
        setCases((prev) =>
          prev.map((c) => (c.id === currentCase.id ? { ...c, status: 'rejected', review_decision: 'rejected', reason: justification } : c))
        );
        try {
          await fetch(`/api/v1/cases/${currentCase.id}/reject`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: justification }),
          });
        } catch (e) {}
        alert(`Case ${currentCase.case_number} REJECTED with justification:\n"${justification}"`);
      };

      // Re-run biometrics
      const handleRunBiometrics = () => {
        setTimeout(() => {
          setCases((prev) =>
            prev.map((c) =>
              c.id === currentCase.id
                ? {
                    ...c,
                    selfie_match: {
                      is_match: true,
                      confidence: 0.945,
                      threshold: 0.75,
                      method: 'opencv_sface',
                      details: 'Re-evaluated facial landmark similarity: High Match Verified',
                    },
                  }
                : c
            )
          );
          alert('Biometric comparison re-evaluated: 94.5% Match Verified!');
        }, 500);
      };

      // Webhook intake (Feature 7 & M3)
      const handleIngestWebhook = async ({ sender, subject }) => {
        try {
          const resp = await fetch('/api/v1/intake/email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender, subject, body: 'Inbound email submission' }),
          });
          if (resp.ok) {
            const data = await resp.json();
            if (data.status === 'attached_to_case' && data.case_id) {
              setCases((prev) =>
                prev.map((c) => (c.id === data.case_id ? { ...c, status: 'documents_received' } : c))
              );
            } else if (data.status === 'routed_to_exception_queue') {
              setExceptions((prev) => [
                { id: data.exception_id || `exc-${Date.now()}`, sender, subject, attachments_count: 1, status: 'unmatched', timestamp: new Date().toISOString() },
                ...prev,
              ]);
            }
            return data;
          }
        } catch (e) {}

        // Fallback local logic
        const match = subject.match(/\[(CASE-[A-Za-z0-9_\-]+)\]/i);
        const msgId = `msg-${Date.now()}@mail.local`;
        if (match) {
          const caseNum = match[1].toUpperCase();
          const target = cases.find((c) => c.case_number === caseNum);
          if (target) {
            setCases((prev) =>
              prev.map((c) =>
                c.id === target.id
                  ? {
                      ...c,
                      status: 'documents_received',
                      document_count: (c.document_count || 1) + 1,
                    }
                  : c
              )
            );
            return { status: 'attached_to_case', case_id: target.id, message_id: msgId };
          }
        }
        const newExc = {
          id: `exc-${Date.now()}`,
          sender,
          subject,
          attachments_count: 1,
          status: 'unmatched',
          timestamp: new Date().toISOString(),
        };
        setExceptions((prev) => [newExc, ...prev]);
        return { status: 'routed_to_exception_queue', message_id: msgId };
      };

      // Assign exception (Feature 8: Email Exception Queue)
      const handleAssignException = async (excId, targetCaseId) => {
        try {
          await fetch(`/api/v1/email/exceptions/${excId}/assign`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ case_id: targetCaseId }),
          });
        } catch (e) {}

        setExceptions((prev) => prev.filter((e) => e.id !== excId));
        setCases((prev) =>
          prev.map((c) =>
            c.id === targetCaseId
              ? {
                  ...c,
                  status: 'documents_received',
                  document_count: (c.document_count || 1) + 1,
                }
              : c
          )
        );
        alert('Exception assigned! Documents transferred and case updated to documents_received.');
      };

      // Dismiss exception
      const handleDismissException = async (excId) => {
        try {
          await fetch(`/api/v1/email/exceptions/${excId}/dismiss`, { method: 'POST' });
        } catch (e) {}
        setExceptions((prev) => prev.filter((e) => e.id !== excId));
      };

      // Create new case
      const handleCreateCaseSubmit = async (e) => {
        e.preventDefault();
        if (!newCaseName.trim()) return;
        const newCaseNum = `CASE-${Math.floor(1000 + Math.random() * 9000)}`;
        let newCase = {
          id: `case-${Date.now()}`,
          case_number: newCaseNum,
          applicant_name: newCaseName.trim(),
          case_type: newCaseType,
          purpose: newCasePurpose.trim() || 'New Merchant Verification',
          status: 'draft',
          created_at: new Date().toISOString(),
          document_count: 0,
          documents: [],
          extracted_fields: [],
          validation_issues: [],
          selfie_match: { is_match: false, confidence: 0 },
        };

        try {
          const res = await fetch('/api/v1/cases', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              applicant: {
                applicant_type: newCaseType,
                first_name: newCaseName.trim().split(' ')[0],
                last_name: newCaseName.trim().split(' ').slice(1).join(' ') || 'Applicant',
              },
              purpose: newCasePurpose.trim() || 'New Verification Case',
            }),
          });
          if (res.ok) {
            const data = await res.json();
            newCase.id = data.id || newCase.id;
            newCase.case_number = data.case_number || newCase.case_number;
          }
        } catch (err) {}

        setCases((prev) => [newCase, ...prev]);
        setIsNewCaseModalOpen(false);
        setNewCaseName('');
        setNewCasePurpose('');
        handleSelectCase(newCase);
      };

      return (
        <div className="min-h-screen">
          {/* Header */}
          <header className="sticky top-0 z-30 backdrop-blur-md bg-white/85 dark:bg-[#0D0D10]/85 border-b border-slate-200 dark:border-white/10 transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <button onClick={() => setActiveView('dashboard')} className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-md">
                    CK
                  </div>
                  <div className="text-left">
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-slate-900 dark:text-white text-base tracking-tight leading-none">
                        CKYC Showcase
                      </span>
                      <span className="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-800/50">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1" />
                        Live MVP
                      </span>
                    </div>
                    <span className="text-[11px] text-slate-500 dark:text-zinc-400 hidden sm:block">
                      eKYC Marketplace & Reviewer Workspace
                    </span>
                  </div>
                </button>

                <nav className="hidden md:flex items-center ml-4 pl-4 border-l border-slate-200 dark:border-white/10 gap-1">
                  <button
                    onClick={() => setActiveView('dashboard')}
                    className={`px-3 py-1.5 rounded-full text-xs font-semibold ${
                      activeView === 'dashboard'
                        ? 'bg-slate-900 text-white dark:bg-white dark:text-black shadow-xs'
                        : 'text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800'
                    }`}
                  >
                    Case Queue
                  </button>
                  <button
                    onClick={() => setIsCredentialModalOpen(true)}
                    className="px-3 py-1.5 rounded-full text-xs font-semibold text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800"
                  >
                    Credential Card
                  </button>
                  <button
                    onClick={() => setIsPortalModalOpen(true)}
                    className="px-3 py-1.5 rounded-full text-xs font-semibold text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800"
                  >
                    Applicant Portal
                  </button>
                </nav>
              </div>

              <div className="flex items-center gap-2.5">
                <span className="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-200/80 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300">
                  Reviewer Role
                </span>

                <button
                  onClick={() => setIsEmailModalOpen(true)}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800/40 shadow-xs"
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                  Email Simulator
                </button>

                <button
                  onClick={() => setIsNewCaseModalOpen(true)}
                  className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-xs"
                >
                  + New Case
                </button>

                {/* Theme Toggle Button (Stark white pill in dark mode) */}
                <button
                  id="theme-toggle-btn"
                  onClick={toggleTheme}
                  className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold transition-all border ${
                    theme === 'dark'
                      ? 'bg-white text-black hover:bg-neutral-200 border-white/20'
                      : 'bg-slate-100 text-slate-800 hover:bg-slate-200 border-slate-300'
                  }`}
                >
                  {theme === 'dark' ? '☀ Light Mode' : '🌙 Obsidian Dark'}
                </button>
              </div>
            </div>
          </header>

          {/* VIEW: DASHBOARD / CASE QUEUE */}
          {activeView === 'dashboard' && (
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
              {/* 4 KPI Cards */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="p-4 rounded-xl bg-white dark:bg-[#16161A] border border-slate-200 dark:border-white/10 shadow-xs">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500 block">Open Cases</span>
                  <div className="text-2xl font-black text-slate-900 dark:text-white mt-1">
                    {cases.filter((c) => !['approved', 'rejected', 'closed', 'expired'].includes(c.status)).length}
                  </div>
                  <span className="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold">↑ 12% this week</span>
                </div>
                <div className="p-4 rounded-xl bg-white dark:bg-[#16161A] border border-slate-200 dark:border-white/10 shadow-xs">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500 block">Pending OCR Review</span>
                  <div className="text-2xl font-black text-slate-900 dark:text-white mt-1">
                    {cases.filter((c) => ['in_review', 'documents_received'].includes(c.status)).length}
                  </div>
                  <span className="text-[10px] text-amber-600 dark:text-amber-400 font-semibold">• High Priority</span>
                </div>
                <div className="p-4 rounded-xl bg-white dark:bg-[#16161A] border border-slate-200 dark:border-white/10 shadow-xs">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500 block">Active Share Grants</span>
                  <div className="text-2xl font-black text-slate-900 dark:text-white mt-1">14</div>
                  <span className="text-[10px] text-cyan-600 dark:text-cyan-400 font-semibold">30-day countdown timer</span>
                </div>
                <div className="p-4 rounded-xl bg-white dark:bg-[#16161A] border border-slate-200 dark:border-white/10 shadow-xs">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500 block">Completed Onboardings</span>
                  <div className="text-2xl font-black text-slate-900 dark:text-white mt-1">
                    {cases.filter((c) => c.status === 'approved').length}
                  </div>
                  <span className="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold">100% Verification Rate</span>
                </div>
              </div>

              {/* Table */}
              <div className="bg-white dark:bg-[#16161A] rounded-xl border border-slate-200 dark:border-white/10 shadow-xs overflow-hidden">
                <div className="px-5 py-3.5 border-b border-slate-200 dark:border-white/10 flex justify-between items-center">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-zinc-400">
                    Active KYC Verification Queue ({cases.length})
                  </h3>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 dark:bg-[#202026] text-slate-500 dark:text-zinc-400 uppercase text-[10px]">
                      <tr>
                        <th className="px-5 py-3">Case ID</th>
                        <th className="px-5 py-3">Applicant / Entity</th>
                        <th className="px-5 py-3">Purpose</th>
                        <th className="px-5 py-3">Status</th>
                        <th className="px-5 py-3">Docs</th>
                        <th className="px-5 py-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                      {cases.map((item) => (
                        <tr key={item.id} className="hover:bg-slate-50 dark:hover:bg-[#202026]/50">
                          <td className="px-5 py-4 font-mono-code font-bold text-slate-900 dark:text-white">{item.case_number}</td>
                          <td className="px-5 py-4">
                            <div className="font-semibold text-slate-900 dark:text-white">{item.applicant_name}</div>
                            <span className="text-[9px] uppercase font-bold text-slate-400">{item.case_type}</span>
                          </td>
                          <td className="px-5 py-4 text-slate-600 dark:text-zinc-300">{item.purpose}</td>
                          <td className="px-5 py-4">
                            <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold ${
                              item.status === 'approved'
                                ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
                                : item.status === 'rejected'
                                ? 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300'
                                : 'bg-cyan-100 text-cyan-800 dark:bg-cyan-950 dark:text-cyan-300 animate-pulse'
                            }`}>
                              {item.status.replace(/_/g, ' ')}
                            </span>
                          </td>
                          <td className="px-5 py-4">{item.document_count || 1} doc(s)</td>
                          <td className="px-5 py-4 text-right">
                            <button
                              onClick={() => handleSelectCase(item)}
                              className="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-white dark:bg-white dark:text-black hover:bg-slate-800 dark:hover:bg-neutral-200"
                            >
                              Inspect / Review →
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* VIEW: 55/45 SPLIT REVIEWER WORKSPACE (Component: ReviewerWorkspace) */}
          {activeView === 'workspace' && currentCase && (
            <div className="flex flex-col min-h-[calc(100vh-4rem)]">
              {/* Stepper Header */}
              <div className="bg-white dark:bg-[#16161A] px-6 py-3 border-b border-slate-200 dark:border-white/10 flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setActiveView('dashboard')}
                    className="px-3 py-1 rounded-lg bg-slate-100 dark:bg-zinc-800 text-xs font-semibold text-slate-700 dark:text-zinc-200"
                  >
                    ← Back to Queue
                  </button>
                  <span className="font-mono-code text-sm font-bold text-slate-900 dark:text-white">
                    {currentCase.case_number}
                  </span>
                  <span className="text-xs text-slate-500">
                    Applicant: <strong>{currentCase.applicant_name}</strong>
                  </span>
                </div>
                <span className="text-xs font-bold uppercase text-cyan-600 dark:text-cyan-400">
                  Status: {currentCase.status.replace(/_/g, ' ')}
                </span>
              </div>

              {/* 11-Stage Visual Stepper */}
              <div className="bg-slate-50 dark:bg-[#111114] px-6 py-2 border-b border-slate-200 dark:border-white/5 overflow-x-auto flex gap-2 text-[11px]">
                {['draft', 'invitation_sent', 'awaiting_documents', 'documents_received', 'ocr_processing', 'needs_applicant_correction', 'in_review', 'approved', 'rejected', 'expired', 'closed'].map((st, i) => (
                  <span
                    key={st}
                    className={`px-2.5 py-0.5 rounded-full font-medium ${
                      st === currentCase.status
                        ? 'bg-cyan-500 text-white font-bold ring-2 ring-cyan-400'
                        : 'bg-slate-200 dark:bg-zinc-800 text-slate-500'
                    }`}
                  >
                    {i + 1}. {st.replace(/_/g, ' ')}
                  </span>
                ))}
              </div>

              {/* 55/45 Split View Container */}
              <div className="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                {/* 55% Left: Document Viewer */}
                <div className="lg:col-span-7 h-[680px] bg-slate-100 dark:bg-[#16161A] rounded-xl border border-slate-200 dark:border-white/10 flex flex-col overflow-hidden">
                  <div className="p-3 bg-white dark:bg-[#202026] border-b border-slate-200 dark:border-white/10 flex justify-between items-center text-xs">
                    <span className="font-bold">Document Inspection (Aadhaar Front / Back)</span>
                    <span className="font-mono-code text-[10px] text-slate-400">SHA-256: 3f7a8109d93e1a0b3f88bc...</span>
                  </div>
                  <div className="flex-1 p-6 flex items-center justify-center bg-slate-200/50 dark:bg-black/40">
                    <div className="w-[420px] h-[540px] bg-white rounded-lg shadow-xl p-6 flex flex-col justify-between border select-none text-slate-800">
                      <div>
                        <h4 className="font-black text-center text-sm border-b pb-2">GOVERNMENT OF INDIA - UNIQUE IDENTIFIER</h4>
                        <div className="mt-6 flex gap-4">
                          <div className="w-24 h-28 bg-slate-200 rounded border flex items-center justify-center text-[10px] font-bold">
                            ID PHOTO
                          </div>
                          <div className="space-y-2 text-xs">
                            <div><span className="text-[10px] text-slate-400 block font-bold">NAME:</span><strong>Aarav Sharma</strong></div>
                            <div><span className="text-[10px] text-slate-400 block font-bold">DOB:</span>15/05/1990</div>
                            <div><span className="text-[10px] text-slate-400 block font-bold">GENDER:</span>Male</div>
                          </div>
                        </div>
                        <div className="mt-8 text-center border-t pt-4">
                          <div className="font-mono font-bold text-lg tracking-widest">2948 2847 2841</div>
                          <span className="text-[9px] text-emerald-700 font-bold">✓ Verhoeff Dihedral Checksum: VALID</span>
                        </div>
                      </div>
                      <div className="text-[9px] font-mono text-center text-slate-400">DOC-SEC-VERIFIED-9842</div>
                    </div>
                  </div>
                </div>

                {/* 45% Right: Verification & Decision Deck */}
                <div className="lg:col-span-5 space-y-4">
                  {/* Algorithmic Checks */}
                  <div className="p-4 rounded-xl bg-white dark:bg-[#16161A] border border-slate-200 dark:border-white/10 space-y-1.5">
                    <div className="flex justify-between items-center mb-2">
                      <h4 className="text-xs font-bold uppercase text-slate-500">Validation Engine (Feature 5)</h4>
                      <span className="text-[10px] font-bold text-emerald-500">100% Passed</span>
                    </div>
                    {currentCase.validation_issues.map((v, i) => (
                      <div key={i} className="text-[11px] p-1.5 rounded bg-slate-50 dark:bg-[#202026] text-slate-700 dark:text-zinc-300">
                        {v.message}
                      </div>
                    ))}
                  </div>

                  {/* BiometricCard Section */}
                  <div className="p-4 rounded-xl bg-white dark:bg-[#16161A] border border-slate-200 dark:border-white/10 space-y-2">
                    <div className="flex justify-between items-center">
                      <h4 className="text-xs font-bold uppercase text-slate-500">Biometric Match (Feature 6)</h4>
                      <span className="text-xs font-bold text-emerald-500">✓ 92.4% Match</span>
                    </div>
                    <div className="w-full bg-slate-200 dark:bg-zinc-800 h-2 rounded-full overflow-hidden">
                      <div className="bg-emerald-500 h-full w-[92%]" />
                    </div>
                    <div className="flex justify-between text-[10px] text-slate-400 pt-1">
                      <span>Engine: OpenCV SFace (Selfie vs ID Photo)</span>
                      <button onClick={handleRunBiometrics} className="text-cyan-500 font-bold hover:underline">Re-run</button>
                    </div>
                  </div>

                  {/* Extracted Fields Deck */}
                  <div className="p-4 rounded-xl bg-white dark:bg-[#16161A] border border-slate-200 dark:border-white/10 space-y-2.5">
                    <h4 className="text-xs font-bold uppercase text-slate-500">Extracted KYC Fields (Feature 11)</h4>
                    {currentCase.extracted_fields.map((f) => (
                      <div key={f.id} className="p-2.5 rounded-lg bg-slate-50 dark:bg-[#202026] border border-slate-200 dark:border-white/5 space-y-1">
                        <div className="flex justify-between items-center text-[10px] uppercase font-bold text-slate-400">
                          <span>{f.field_name.replace(/_/g, ' ')}</span>
                          <span className="text-emerald-500">High (98%)</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-slate-900 dark:text-white">
                            {f.confirmed_value || f.draft_value}
                          </span>
                          <div className="flex gap-1">
                            <button
                              onClick={() => handleUpdateFieldDecision(f.id, 'confirmed')}
                              className="px-2 py-0.5 rounded text-[10px] bg-slate-200 dark:bg-zinc-800 hover:bg-emerald-500 hover:text-white"
                            >
                              Confirm
                            </button>
                            <button
                              onClick={() => {
                                const val = prompt('Edit field value:', f.confirmed_value || f.draft_value);
                                if (val) handleUpdateFieldDecision(f.id, 'corrected', val);
                              }}
                              className="px-2 py-0.5 rounded text-[10px] bg-slate-200 dark:bg-zinc-800 hover:bg-cyan-500 hover:text-white"
                            >
                              Edit
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Sticky Decision Bar (Component: DecisionBar) */}
              <div className="sticky bottom-0 bg-white/95 dark:bg-[#16161A]/95 border-t border-slate-200 dark:border-white/10 p-4 shadow-lg">
                <div className="max-w-4xl mx-auto flex flex-col gap-2">
                  {!['in_review', 'approved', 'rejected'].includes(currentCase.status) && (
                    <div className="flex justify-between items-center text-xs text-amber-500">
                      <span>Case status is {currentCase.status}. Advance to In Review to enable final decisions.</span>
                      <button onClick={handleAdvanceToReview} className="px-3 py-1 rounded bg-amber-500 text-white font-bold">
                        Advance to In Review
                      </button>
                    </div>
                  )}

                  <div className="flex gap-2">
                    <input
                      id="decision-rationale-input"
                      type="text"
                      placeholder="Mandatory written justification rationale for case approval/rejection..."
                      className="flex-1 text-xs px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#202026] border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white outline-none"
                    />
                    <button
                      onClick={() => {
                        const val = document.getElementById('decision-rationale-input').value;
                        if (!val.trim()) { alert('Mandatory written justification is required!'); return; }
                        handleRejectCase(val.trim());
                      }}
                      className="px-4 py-2 rounded-full text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white"
                    >
                      Reject Case
                    </button>
                    <button
                      onClick={() => {
                        const val = document.getElementById('decision-rationale-input').value;
                        if (!val.trim()) { alert('Mandatory written justification is required!'); return; }
                        handleApproveCase(val.trim());
                      }}
                      className="px-5 py-2 rounded-full text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white"
                    >
                      Approve Case
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modals */}
          {/* 1. Email Simulator Modal (Component: EmailSimulatorModal) */}
          {isEmailModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
              <div className="bg-white dark:bg-[#16161A] w-full max-w-lg rounded-2xl border border-slate-200 dark:border-white/10 shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-bold text-slate-900 dark:text-white">Email Intake Simulator</h3>
                  <button onClick={() => setIsEmailModalOpen(false)}>✕</button>
                </div>
                <div className="space-y-3">
                  <button
                    onClick={async () => {
                      const res = await handleIngestWebhook({ sender: 'applicant@example.com', subject: 'KYC Docs [CASE-1042]' });
                      alert(`Ingestion Result: ${res.status}`);
                    }}
                    className="w-full py-2 rounded-lg bg-indigo-600 text-white font-bold text-xs"
                  >
                    Simulate Matched Inbound Email [CASE-1042]
                  </button>
                  <button
                    onClick={async () => {
                      const res = await handleIngestWebhook({ sender: 'spam@unknown.com', subject: 'No Reference' });
                      alert(`Routed to Exception Queue!`);
                    }}
                    className="w-full py-2 rounded-lg bg-slate-200 dark:bg-zinc-800 text-xs font-bold"
                  >
                    Simulate Unmatched Inbound Email (Routes to Exception Queue)
                  </button>
                </div>
                <div className="pt-2 border-t">
                  <span className="text-xs font-bold block mb-2">Exception Queue ({exceptions.length} items):</span>
                  {exceptions.map((exc) => {
                    const assignableCases = cases.filter((c) => !['approved', 'rejected', 'closed', 'expired'].includes(c.status));
                    return (
                      <div key={exc.id} className="p-2.5 rounded bg-slate-50 dark:bg-zinc-800 text-xs flex flex-col gap-1.5 mb-2">
                        <div className="flex justify-between items-center">
                          <span className="font-semibold">{exc.subject}</span>
                          <button
                            onClick={() => handleDismissException(exc.id)}
                            className="px-2 py-0.5 rounded bg-slate-200 dark:bg-zinc-700 text-[10px]"
                          >
                            Dismiss
                          </button>
                        </div>
                        <div className="flex gap-1 items-center">
                          <select
                            id={`assign-select-${exc.id}`}
                            className="flex-1 text-[11px] p-1 rounded bg-white dark:bg-zinc-900 border text-slate-800 dark:text-zinc-200"
                          >
                            {assignableCases.map((c) => (
                              <option key={c.id} value={c.id}>
                                {c.case_number} - {c.applicant_name} ({c.status})
                              </option>
                            ))}
                          </select>
                          <button
                            onClick={() => {
                              const sel = document.getElementById(`assign-select-${exc.id}`);
                              const cid = sel && sel.value ? sel.value : (assignableCases[0] ? assignableCases[0].id : null);
                              if (cid) handleAssignException(exc.id, cid);
                            }}
                            className="px-2.5 py-1 rounded bg-indigo-600 text-white text-[10px] font-bold"
                          >
                            Assign →
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* 2. Credential Showcase Modal (Component: CredentialShowcase) */}
          {isCredentialModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
              <div className="bg-white dark:bg-[#16161A] w-full max-w-md rounded-2xl border p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold">Holographic Credential Showcase</h3>
                  <button onClick={() => setIsCredentialModalOpen(false)}>✕</button>
                </div>
                <div
                  className="rounded-xl p-6 text-slate-900 shadow-xl"
                  style={{ background: 'linear-gradient(135deg, #a7f3d0 0%, #bae6fd 50%, #fbcfe8 100%)' }}
                >
                  <span className="text-[10px] font-black uppercase">DIGITAL IDENTITY PASSPORT</span>
                  <h2 className="text-lg font-black mt-1">VERIFIED KYC CREDENTIAL</h2>
                  <div className="mt-3 bg-white/80 p-2 rounded-lg flex justify-between items-center text-xs font-bold">
                    <span>Valid for 28 more days</span>
                    <span className="bg-slate-900 text-white px-2 py-0.5 rounded-full text-[10px]">30-Day Grant</span>
                  </div>
                </div>
                <div className="text-xs text-slate-600 dark:text-zinc-400 space-y-1">
                  <div>• Applicant: <strong>Aarav Sharma</strong></div>
                  <div>• Aadhaar: <strong>Verified Active (Verhoeff Checked)</strong></div>
                  <div>• Biometric: <strong>92.4% Similarity Verified</strong></div>
                  <div className="pt-2 text-[10px] text-zinc-500">
                    Raw document binaries remain sealed. Only verified cryptographic claims are shared.
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 3. Applicant Portal Modal */}
          {isPortalModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
              <div className="bg-white dark:bg-[#16161A] w-full max-w-md rounded-2xl border p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold">Applicant Self-Service Portal</h3>
                  <button onClick={() => setIsPortalModalOpen(false)}>✕</button>
                </div>
                <div className="border-2 border-dashed rounded-xl p-8 text-center text-xs text-slate-500">
                  Drag and drop identity document (PDF / JPEG / PNG up to 10MB)
                </div>
                <button
                  onClick={() => {
                    alert('Document submitted successfully!');
                    setIsPortalModalOpen(false);
                  }}
                  className="w-full py-2 rounded-full bg-cyan-600 text-white text-xs font-bold"
                >
                  Confirm & Submit Document →
                </button>
              </div>
            </div>
          )}

          {/* 4. New Case Modal */}
          {isNewCaseModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
              <form onSubmit={handleCreateCaseSubmit} className="bg-white dark:bg-[#16161A] w-full max-w-md rounded-2xl border p-6 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold">Create New KYC Case</h3>
                  <button type="button" onClick={() => setIsNewCaseModalOpen(false)}>✕</button>
                </div>
                <input
                  type="text"
                  required
                  placeholder="Applicant Full Name"
                  value={newCaseName}
                  onChange={(e) => setNewCaseName(e.target.value)}
                  className="w-full text-xs p-2 rounded border bg-slate-50 dark:bg-zinc-800"
                />
                <input
                  type="text"
                  placeholder="Verification Purpose"
                  value={newCasePurpose}
                  onChange={(e) => setNewCasePurpose(e.target.value)}
                  className="w-full text-xs p-2 rounded border bg-slate-50 dark:bg-zinc-800"
                />
                <button type="submit" className="w-full py-2 rounded-full bg-emerald-600 text-white text-xs font-bold">
                  Create Case →
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    // Mount Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
